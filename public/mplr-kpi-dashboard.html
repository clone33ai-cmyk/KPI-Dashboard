                          </div>
                          {isOpen && (
                            <div style={{ padding: "2px 6px 12px", fontSize: 13.5 }}>
                              {r.rec && <audio controls preload="none" src={r.rec} style={{ width: "100%", marginBottom: 8 }} />}
                              <div style={{ whiteSpace: "pre-wrap", color: C.ink, background: C.navy3, borderRadius: 6, padding: 10 }}>{r.tx || "(no transcript captured)"}</div>
                              {r.rec && <a href={r.rec} target="_blank" rel="noopener" className="note" style={{ display: "inline-block", marginTop: 6 }}>Open recording in new tab ↗</a>}
                            </div>
                          )}
                        </div>
                      );
                    })}
                    {filtered.length === 0 && <p className="note">No calls match that filter.</p>}
                    {filtered.length > 25 && (
                      <p className="note" style={{ marginTop: 8, cursor: "pointer", color: C.goldSoft, fontWeight: 600 }} onClick={() => setShowAllKathy(!showAllKathy)}>
                        {showAllKathy ? "Show fewer" : `Show all ${filtered.length}`}
                      </p>
                    )}
                  </div>
                );
              })()}
              <p className="note" style={{ marginTop: 14 }}>Grading is transcript-based: a caller counts as real when their own words mention pool work, scheduling, or returning a call; spam when they pitch websites, listings, loans, and the like. Screening quality and telephony quality are graded separately on purpose.</p>
            </>
          )
        )}

        {/* ================= SCORECARD ================= */}
        {tab === "scorecard" && (
          !hasData ? (
            <div className="panel">
              <p style={{ marginBottom: 12 }}>No data on file yet. Head to Upload Data and drop in the CallRail, Housecall Pro, Google Ads, and LSA exports. The scorecard fills in from there for any date range you pick.</p>
              <button className="btn" onClick={() => setTab("upload")}>Go to Upload Data</button>
            </div>
          ) : (
            <>
              <div className="gauge">
                <div className="pool" role="img" aria-label={`Overall health ${health.pct} percent`}>
                  <div className="water" style={{ height: `${health.pct}%` }} />
                  <div className="pct">{health.pct}%</div>
                </div>
                <div className="gaugeInfo">
                  <b>Waterline: overall health</b>
                  <div className="note">Green counts full, yellow counts half, across {health.total} graded metrics in this range</div>
                  <div className="pills">
                    <span className="pill" style={{ background: C.green }}>{health.g} green</span>
                    <span className="pill" style={{ background: C.yellow, color: "#fff" }}>{health.y} yellow</span>
                    <span className="pill" style={{ background: C.red }}>{health.r} red</span>
                  </div>
                </div>
                <div style={{ marginLeft: "auto" }} className="note">
                  In range: {cur.counts.calls.toLocaleString()} calls · {cur.counts.jobs.toLocaleString()} {cur.counts.paidBasis ? 'paid' : 'completed'} jobs · {cur.counts.lsaRows.toLocaleString()} charged LSA leads
                  {cur.counts.unmatchedPhones > 0 && <><br />{cur.counts.unmatchedPhones.toLocaleString()} calls had no caller ID (can't be matched to HCP)</>}
                </div>
              </div>

              {SECTIONS.map((sec) => (
                <div key={sec.id}>
                  <div className="sectionhead"><h2>{sec.label}</h2>{sec.owner && <small>{sec.owner}</small>}</div>
                  <div className="grid">
                    {scored.filter((s) => s.metric.section === sec.id).map((s) => {
                      const meta = STATUS_META[s.status];
                      const good = s.metric.betterWhen === "up" ? (s.delta ?? 0) >= 0 : (s.delta ?? 0) <= 0;
                      return (
                        <div key={s.metric.id} className="card" style={{ borderLeftColor: meta.color }}>
                          <div className="top">
                            <div className="mname">{s.metric.name}</div>
                            <span className="chip" style={{ background: meta.color, color: "#fff" }}>{meta.label}</span>
                          </div>
                          <div className="val">
                            {fmtVal(s.metric, s.value)}
                            {s.delta !== null && Math.abs(s.delta) >= 0.5 && (
                              <span className="delta" style={{ color: good ? C.green : C.red }}>
                                {s.delta > 0 ? "▲" : "▼"} {Math.abs(s.delta).toFixed(0)}% vs. prior
                              </span>
                            )}
                          </div>
                          {s.note && <div className="note">{s.note}</div>}
                          {s.metric.mode === "manual" && (
                            <div className="inline">
                              <input type="number" step="any" placeholder={`This month's ${s.metric.unit}`}
                                value={manualFor[s.metric.id] ?? ""}
                                onChange={(e) => setManual(s.metric.id, e.target.value)} />
                              <span className="note">{monthKey}</span>
                            </div>
                          )}
                          {s.metric.manualExtra === "lsaSpend" && (() => {
                            const billed = new Set((data.lsabill || []).map((r) => r.d.slice(0, 7)));
                            const typed = new Set(Object.entries(data.manual).filter(([mk, v]) => v && v.lsaSpend).map(([mk]) => mk));
                            const covered = rangeMonths.filter((mk) => billed.has(mk) || typed.has(mk));
                            const missing = rangeMonths.filter((mk) => !billed.has(mk) && !typed.has(mk));
                            return (
                              <div style={{ marginTop: 8 }}>
                                {covered.length > 0 && missing.length === 0 && (
                                  <div className="note" style={{ color: C.green }}>Calculated automatically from LSA billing for every month in this range.</div>
                                )}
                                {covered.length > 0 && missing.length > 0 && (
                                  <div className="note">Calculated from the months with spend data ({covered.join(", ")}). Months without billing ({missing.join(", ")}) are left out of this number, not guessed. Upload their billing files to include them.</div>
                                )}
                                {covered.length === 0 && (
                                  <div className="note">Upload the LSA billing exports (Upload tab) and this calculates itself.</div>
                                )}
                                {missing.length > 0 && (
                                  <div style={{ marginTop: 6 }}>
                                    <button className="btn ghost" style={{ padding: "4px 10px", fontSize: 12 }} onClick={() => setShowLsaManual(!showLsaManual)}>
                                      {showLsaManual ? "Hide manual entry" : "Type spend manually instead"}
                                    </button>
                                    {showLsaManual && missing.map((mk) => (
                                      <div className="inline" key={mk} style={{ marginTop: 4 }}>
                                        <span className="note" style={{ width: 62 }}>{mk}</span>
                                        <input type="number" step="any" placeholder="$"
                                          value={(data.manual[mk] || {}).lsaSpend ?? ""}
                                          onChange={(e) => setManualMonth(mk, "lsaSpend", e.target.value)} />
                                      </div>
                                    ))}
                                  </div>
                                )}
                              </div>
                            );
                          })()}
                          {s.metric.mode === "select" && (
                            <div className="inline">
                              <select value={manualFor[s.metric.id] || ""} onChange={(e) => setManual(s.metric.id, e.target.value)} style={{ width: "auto" }}>
                                <option value="">Set status…</option>
                                {s.metric.options.map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}
                              </select>
                            </div>
                          )}
                          <div className="hint">{s.metric.hint}</div>
                          <div className="src">Source: {s.metric.source}</div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              ))}

              <div className="panel" style={{ marginTop: 24 }}>
                <div className="sectionhead" style={{ margin: "0 0 4px" }}><h2>Source economics</h2><small>leads → booked → dollars, with cost per call, click, and acquisition</small></div>
                {Object.entries(cur.srcPerf)
                  .sort((a, b) => b[1].leads - a[1].leads || b[1].revenue - a[1].revenue)
                  .map(([s, p]) => {
                    const k = cur.counts;
                    const spend = s === "Google Ads" ? k.adsCost : s === "LSA" ? k.lsaCost : null;
                    const paidChannel = s === "Google Ads" || s === "LSA";
                    const econ = [];
                    if (spend && p.leads) econ.push(`$${Math.round(spend / p.leads).toLocaleString()} per call`);
                    if (s === "Google Ads" && spend && k.adsClicks) econ.push(`$${(spend / k.adsClicks).toFixed(2)} per click`);
                    if (spend && p.booked) econ.push(`$${Math.round(spend / p.booked).toLocaleString()} per acquisition`);
                    if (spend && p.revenue) econ.push(`${(p.revenue / spend).toFixed(1)}:1 return`);
                    if (s === "LSA" && k.lsaRows) econ.push(`${k.lsaRows} charged by Google in range (billing count, not bookings)`);
                    return (
                      <div key={s} style={{ borderBottom: `1px solid ${C.line}`, padding: "9px 6px" }}>
                        <div style={{ display: "flex", gap: 14, flexWrap: "wrap", alignItems: "baseline" }}>
                          <b style={{ minWidth: 130 }}>{s}</b>
                          <span className="note">{p.leads.toLocaleString()} leads</span>
                          <span className="note">{p.booked.toLocaleString()} booked{p.leads ? ` (${((p.booked / p.leads) * 100).toFixed(0)}%)` : ""}</span>
                          <span style={{ marginLeft: "auto", color: C.goldSoft, fontWeight: 600 }}>
                            {p.jobs.toLocaleString()} paid job{p.jobs === 1 ? "" : "s"} · ${Math.round(p.revenue).toLocaleString()}
                          </span>
                        </div>
                        <div className="note" style={{ marginTop: 3, fontSize: 12.5 }}>
                          {econ.length ? econ.join(" · ") : paidChannel ? "no spend data in this range" : s === "No matched call" ? "bookings with no call trail" : "free channel: $0 per call, $0 per acquisition"}
                        </div>
                      </div>
                    );
                  })}
                <p className="note" style={{ marginTop: 8 }}>Booked = the caller's phone matched an HCP job created within 30 days. Dollars = paid jobs attributed to the customer's latest call before booking. "No matched call" = paid jobs whose customer has no call on file (booked by text, email, form, or an untracked line).</p>
              </div>

              <div className="panel" style={{ marginTop: 24 }}>
                <button className="btn ghost" style={{ color: C.goldSoft, borderColor: C.gold }} onClick={() => setShowAccuracy(!showAccuracy)}>
                  {showAccuracy ? "Hide" : "How accurate is this data?"}
                </button>
                {showAccuracy && (
                  <div style={{ marginTop: 14, lineHeight: 1.55 }}>
                    <p style={{ marginBottom: 10 }}><b style={{ color: C.green }}>Exact (read straight from your files):</b> call counts, answer rate, abandonment rate, charged LSA lead counts, completed job totals and average ticket, and Google Ads monthly spend (taken from the report's Total: Account rows, the same number the Ads dashboard shows).</p>
                    <p style={{ marginBottom: 10 }}><b style={{ color: C.yellow }}>Good estimate:</b> booking rate and conversion. A call counts as booked when that caller's phone number appears on an HCP job created within 30 days of the call. This misses jobs booked under a different number (a spouse's phone, an office line) and can credit a call for a booking that came through another channel. It tracks the true rate closely but is not a per-call certainty.</p>
                    <p style={{ marginBottom: 10 }}><b style={{ color: C.yellow }}>Depends on the HCP export:</b> conversion in recent weeks is only complete when the jobs upload includes ALL job statuses, not just Completed. In HCP set the Jobs status filter to all statuses before exporting. Re-uploads update changed jobs by Job #, so uploading the fresh full export keeps everything current.</p>
                    <p style={{ marginBottom: 10 }}><b style={{ color: C.yellow }}>Prorated:</b> ads and LSA spend arrive as monthly totals, so mid-month date ranges spread the month's cost evenly per day. MTD cost figures are estimates until the month closes.</p>
                    <p style={{ marginBottom: 10 }}><b style={{ color: C.yellow }}>Source labels:</b> LSA is phone-verified (a caller whose number appears in the uploaded LSA lead exports counts as LSA no matter what CallRail named the source). Other sources are bucketed from CallRail source names by keyword, so odd names can land in Other.</p>
                    <p><b>To trust it, spot-check once:</b> pick a closed month, then compare three numbers against the native dashboards: total answered calls vs. CallRail, monthly spend vs. Google Ads, and average job value vs. HCP reporting. If those three line up, the rest is derived from the same rows.</p>
                  </div>
                )}
              </div>
            </>
          )
        )}

        {/* ================= UPLOAD ================= */}
        {tab === "upload" && (
          <div className="panel">
            <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center", marginBottom: 12 }}>
              <p className="note" style={{ flex: "1 1 300px" }}>
                {SERVER_MODE
                  ? "Uploads here save to the server: the moment a sheet imports, this becomes the live page for everyone who opens the site, on any device."
                  : "Export from each system and drop files here. Recognized files import instantly, several at a time. Re-uploading overlapping exports is safe, duplicates are skipped."}
                {SERVER_MODE && data.meta && data.meta.lastUpdated ? ` Last updated: ${new Date(data.meta.lastUpdated).toLocaleString()}.` : ""}
              </p>
              <button className="btn ghost" style={{ color: C.goldSoft, borderColor: C.gold }} onClick={downloadBackup}>Download backup</button>
              <input ref={backupRef} type="file" accept=".json" style={{ display: "none" }}
                onChange={(e) => { const f = e.target.files[0]; if (f) restoreBackup(f); e.target.value = ""; }} />
              <button className="btn ghost" style={{ color: C.goldSoft, borderColor: C.gold }} onClick={() => backupRef.current.click()}>Restore backup</button>
            </div>
            {SERVER_MODE && (
              <div style={{ border: `1px solid ${C.gold}`, borderRadius: 8, padding: "12px 14px", marginBottom: 14, background: C.navy2 }}>
                <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
                  <div style={{ flex: "1 1 320px" }}>
                    <b style={{ color: C.gold }}>HCP direct sync — true line items</b>
                    <p className="note" style={{ margin: "4px 0 0" }}>Pulls every job with its invoice line items AND all estimates straight from Housecall Pro — no more daily sheet uploads. Runs itself nightly at 2:00 AM Central; this button forces it now.{data.meta && data.meta.hcpSync ? ` Last sync: ${new Date(data.meta.hcpSync.at).toLocaleString()} — ${(data.meta.hcpSync.withLineItems || 0).toLocaleString()} jobs with line items.` : ""}</p>
                  </div>
                  <button className="btn" disabled={hcpBusy} onClick={startHcpSync}>{hcpBusy ? "Syncing…" : "Sync from HCP"}</button>
                </div>
                {hcpStatus && (
                  <p className="note" style={{ marginTop: 8, color: hcpStatus.error ? C.red : C.dim, fontFamily: "monospace", fontSize: 12 }}>
                    {hcpStatus.error
                      ? `⚠ ${hcpStatus.error}${hcpStatus.authHint ? " — " + hcpStatus.authHint : ""}`
                      : `${hcpStatus.phase || "…"} · ${(hcpStatus.jobsSeen || 0).toLocaleString()} jobs · ${(hcpStatus.liFetched || 0).toLocaleString()} line-item sets · ${(hcpStatus.merged || 0).toLocaleString()} merged${hcpStatus.created ? ` · ${hcpStatus.created.toLocaleString()} jobs created from HCP` : ""}${hcpStatus.liFailures ? ` · ${hcpStatus.liFailures} failed` : ""}${hcpStatus.descFilled ? ` · ${hcpStatus.descFilled} descriptions filled` : ""}${hcpStatus.estimates ? ` · ${hcpStatus.estimates.toLocaleString()} estimates synced` : ""}${hcpStatus.estimatesError ? ` · ⚠ estimates: ${hcpStatus.estimatesError}` : ""}`}
                  </p>
                )}
              </div>
            )}
            <div style={{ display: "none" }}>
            </div>

            {uploadMsg && (
              <div className="msg" style={{ background: uploadMsg.ok ? "rgba(47,143,91,.15)" : "rgba(192,57,43,.15)", border: `1px solid ${uploadMsg.ok ? C.green : C.red}` }}>
                {uploadMsg.text}
              </div>
            )}

            {pending ? (
              <div className="upcard" style={{ marginBottom: 8 }}>
                <h3>One-time column mapping: {pending.fileName}{pendingList.length > 1 ? ` (file 1 of ${pendingList.length})` : ""}</h3>
                <p className="tip">A required column was not recognized in this file. Pick it once ( <span className="req">*</span> required); this layout will import automatically from now on.</p>
                {SOURCES[pending.type].fields.map((f) => (
                  <div className="maprow" key={f.id}>
                    <label>{f.label}{f.required && <span className="req"> *</span>}</label>
                    <select value={pending.map[f.id] || ""} onChange={(e) => setPendingList([{ ...pending, map: { ...pending.map, [f.id]: e.target.value || undefined } }, ...pendingList.slice(1)])}>
                      <option value="">Not in this file</option>
                      {pending.headers.map((h) => <option key={h} value={h}>{h}</option>)}
                    </select>
                  </div>
                ))}
                <div style={{ display: "flex", gap: 10, marginTop: 12 }}>
                  <button className="btn" onClick={confirmImport}>Import rows</button>
                  <button className="btn ghost" onClick={() => setPendingList(pendingList.slice(1))}>Skip this file</button>
                </div>
              </div>
            ) : (
              <>
                <div className="upgrid">
                  {Object.entries(SOURCES).map(([type, cfg]) => (
                    <div className="upcard" key={type}>
                      <h3>{cfg.label}</h3>
                      <p className="tip">{cfg.tip}</p>
                      <p className="count">{data[type].length.toLocaleString()} rows on file</p>
                      <div style={{ display: "flex", gap: 10, marginTop: 10, flexWrap: "wrap" }}>
                        <input ref={fileRefs[type]} type="file" accept=".csv,.xlsx,.xls" multiple style={{ display: "none" }}
                          onChange={(e) => { if (e.target.files.length) handleFiles(type, e.target.files); e.target.value = ""; }} />
                        <button className="btn" onClick={() => fileRefs[type].current.click()}>Upload file(s)</button>
                        {data[type].length > 0 && <button className="btn ghost" onClick={() => clearSource(type)}>Clear data</button>}
                      </div>
                    </div>
                  ))}
                </div>

                {trackingNumbers.length > 0 && (
                  <div style={{ marginTop: 22 }}>
                    <div className="sectionhead" style={{ margin: "0 0 4px" }}><h2>Which numbers count?</h2></div>
                    <p className="note" style={{ marginBottom: 8 }}>
                      Checked lines feed the scorecard. The Not Spam line and My Company lines are pre-checked (a human answers those). Kathy's public screening numbers start unchecked so her 100% pickup doesn't fake the stats. Adjust anything, it's remembered.
                    </p>
                    {trackingNumbers.map((n) => {
                      const inc = data.numFilter[n.tn] !== false;
                      return (
                        <button key={n.tn} className="numrow" onClick={() => toggleNumber(n.tn)} aria-pressed={inc}>
                          <span className={"numbox" + (inc ? " inc" : "")}>{inc ? "✓" : ""}</span>
                          <span style={{ fontWeight: 600 }}>{n.nn || n.tn.replace(/(\d{3})(\d{3})(\d{4})/, "($1) $2-$3")}</span>
                          <span className="note">{n.co}</span>
                          <span className="note" style={{ marginLeft: "auto" }}>{n.count.toLocaleString()} calls · {inc ? "Included" : "Excluded"}</span>
                        </button>
                      );
                    })}
                  </div>
                )}
              </>
            )}
          </div>
        )}

        {/* ================= TRENDS ================= */}
        {tab === "trends" && (
          <div className="panel">
            <div style={{ display: "flex", gap: 12, alignItems: "center", marginBottom: 16, flexWrap: "wrap" }}>
              <label style={{ color: C.dim, fontSize: 13 }}>Metric · {trendMonthly ? "charted monthly (spend data is monthly-grade)" : "charted weekly"}</label>
              <select value={trendMetric} onChange={(e) => setTrendMetric(e.target.value)}>
                {METRICS.filter((m) => !m.mode || m.mode.startsWith("vsPrev")).map((m) => (
                  <option key={m.id} value={m.id}>{m.name}</option>
                ))}
              </select>
            </div>
            {trendData.length < 2 ? (
              <p className="note">Upload data spanning at least two {trendMonthly ? "months" : "weeks"} to see a trend for {trendM ? trendM.name : "this metric"}.</p>
            ) : (
              <TrendChart data={trendData} label={trendM ? trendM.name : ""} colors={{ gold: C.gold, dim: C.dim, line: C.line, card: C.navy2, ink: C.ink }} />
            )}
            {trendM && trendData.length >= 2 && (() => {
              const vals = trendData.map((d) => d.value);
              const latest = trendData[trendData.length - 1];
              const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
              const up = trendM.betterWhen === "up";
              const bestV = up ? Math.max(...vals) : Math.min(...vals);
              const worstV = up ? Math.min(...vals) : Math.max(...vals);
              const best = trendData.find((d) => d.value === bestV);
              const worst = trendData.find((d) => d.value === worstV);
              const unit = trendMonthly ? "month" : "week";
              const N = trendMonthly ? 3 : 4;
              const lastN = vals.slice(-N); const prevN = vals.slice(-2 * N, -N);
              let dir = `holding steady vs. the previous ${trendMonthly ? "months" : "month"}`;
              if (prevN.length >= 2) {
                const a1 = lastN.reduce((a, b) => a + b, 0) / lastN.length;
                const a0 = prevN.reduce((a, b) => a + b, 0) / prevN.length;
                const chg = a0 ? ((a1 - a0) / Math.abs(a0)) * 100 : 0;
                if (Math.abs(chg) >= 5) {
                  const moved = `${chg > 0 ? "up" : "down"} ${Math.abs(chg).toFixed(0)}% over the last ${N} ${unit}s vs. the ${N} before`;
                  dir = ((chg > 0) === up ? "improving: " : "slipping: ") + moved;
                }
              }
              const grade = trendM.score ? trendM.score(latest.value) : null;
              return (
                <div style={{ marginTop: 16, borderTop: `1px dashed ${C.line}`, paddingTop: 14 }}>
                  <p style={{ marginBottom: 8 }}>
                    <b>Latest {trendMonthly ? "month" : "week"} ({trendMonthly ? latest.week : `ending ${latest.week}`}): {fmtVal(trendM, latest.value)}</b>
                    {grade && <span className="chip" style={{ background: STATUS_META[grade].color, color: "#fff", marginLeft: 10 }}>{STATUS_META[grade].label}</span>}
                  </p>
                  <p className="note" style={{ marginBottom: 6 }}>
                    Average across {trendData.length} {trendMonthly ? "months" : "weeks"}: {fmtVal(trendM, avg)}. Best {trendMonthly ? "month" : "week"}: {fmtVal(trendM, best.value)} ({trendMonthly ? best.week : `ending ${best.week}`}). Worst: {fmtVal(trendM, worst.value)} ({trendMonthly ? worst.week : `ending ${worst.week}`}).
                  </p>
                  <p className="note" style={{ marginBottom: 8 }}>Right now this metric is {dir}.</p>
                  <p className="note">How it grades: {trendM.hint}</p>
                </div>
              );
            })()}
          </div>
        )}
      </div>
    </div>
  );
}


/* Chart.js line chart (replaces recharts for the standalone HTML build) */
function TrendChart({ data, label, colors }) {
  const c = colors || { gold: "#c9a84c", dim: "#8fa1ba", line: "#233754", card: "#101f36", ink: "#e8edf5" };
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (!canvasRef.current) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: "line",
      data: {
        labels: data.map((d) => d.week),
        datasets: [{
          label,
          data: data.map((d) => d.value),
          borderColor: c.gold,
          backgroundColor: c.gold,
          pointRadius: 4,
          pointHoverRadius: 6,
          borderWidth: 2.5,
          tension: 0.3,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { labels: { color: c.dim, font: { family: "'Barlow Semi Condensed', Arial" } } },
          tooltip: { backgroundColor: c.card, borderColor: c.line, borderWidth: 1, titleColor: c.gold, bodyColor: c.ink },
        },
        scales: {
          x: { ticks: { color: c.dim }, grid: { color: c.line } },
          y: { ticks: { color: c.dim }, grid: { color: c.line } },
        },
      },
    });
    return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
  }, [JSON.stringify(data), label, JSON.stringify(colors)]);
  return <div style={{ width: "100%", height: 340 }}><canvas ref={canvasRef} /></div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>

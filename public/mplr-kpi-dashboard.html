   Mr. Pool Leak Repair — KPI Dashboard v4

   - CallRail Call_List .xlsx (Cover Sheet + Calls sheets)
   - HCP jobs export (Job created/completed, Customer mobile, Job amount)
   - Google Ads Campaign report (UTF-16, monthly rows, Total: rows)
   - LSA leads-inbox .csv (no price column → monthly spend input)

   Logic:
   - Booked = caller phone matched to an HCP job created within 30 days.
   - Existing customer = caller phone had HCP jobs before the call.
   - Repeat job = customer phone had an earlier job in history
     (HCP lead-source field is blank in the real export).

/* storage priority: server API (shared live data) → artifact storage → localStorage */
const SERVER_MODE = typeof window !== "undefined" && window.location.protocol.startsWith("http") && !(window.storage && window.storage.get);
const store = {
  async get(k) {
    if (SERVER_MODE) {
      const r = await fetch("/api/data").catch(() => null);
      if (r && r.ok) {
        const j = await r.json();
        if (j && (j.calls || j.jobs)) return { key: k, value: JSON.stringify(j) };
        return null;
      }
      const err = new Error(r ? `the server refused the data request (HTTP ${r.status}${r.status === 401 ? " — sign-in required; reload the page and enter the dashboard username and password" : ""})` : "the server could not be reached");
      err.loadFail = true;
      throw err;
    }
    if (typeof window !== "undefined" && window.storage && window.storage.get) return window.storage.get(k);
    const v = localStorage.getItem(k);
    if (v === null) throw new Error("not found");
    return { key: k, value: v };
  },
  async set(k, v) {
    if (SERVER_MODE) {
      const r = await fetch("/api/data", { method: "POST", headers: { "Content-Type": "application/json" }, body: v });
      if (!r.ok) throw new Error("server rejected the save (HTTP " + r.status + ")");
      return { key: k, value: v };
    }
    if (typeof window !== "undefined" && window.storage && window.storage.set) return window.storage.set(k, v);
    localStorage.setItem(k, v);
    return { key: k, value: v };
  },
};

/* ---------------- parsing helpers ---------------- */

const MONTHS = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };

function parseDate(v) {
  if (v === undefined || v === null || v === "") return null;
  if (v instanceof Date && !isNaN(v)) return v;
  if (typeof v === "number") {
    const days = Math.floor(v);
    const ms = Math.round((v - days) * 86400000);
    const d = new Date(1899, 11, 30);
    d.setDate(d.getDate() + days);
    d.setMilliseconds(d.getMilliseconds() + ms);
    return isNaN(d) ? null : d;
  }
  const s = String(v).trim();
  let d = new Date(s);
  if (!isNaN(d)) return d;
  const m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (m) {
    const yr = m[3].length === 2 ? "20" + m[3] : m[3];
    d = new Date(Number(yr), Number(m[1]) - 1, Number(m[2]));
    if (!isNaN(d)) return d;
  }
  return null;
}

function parseMonth(v) {
  const s = String(v || "").trim().toLowerCase();
  let m = s.match(/^(\d{4})-(\d{1,2})$/);
  if (m) return { y: Number(m[1]), mo: Number(m[2]) - 1 };
  m = s.match(/^([a-z]{3,9})\s+(\d{4})$/);
  if (m && MONTHS[m[1].slice(0, 3)] !== undefined) return { y: Number(m[2]), mo: MONTHS[m[1].slice(0, 3)] };
  return null;
}

const parseNum = (v) => {
  if (v === undefined || v === null || v === "") return null;
  if (typeof v === "number") return v;
  const n = Number(String(v).replace(/[$,%\s"]/g, "").replace(/,/g, ""));
  return Number.isNaN(n) ? null : n;
};

const normPhone = (v) => {
  const digits = String(v || "").replace(/\D/g, "");
  return digits.length >= 10 ? digits.slice(-10) : digits;
};

/* local calendar date: never use toISOString here — it converts to UTC and
   shifts midnight-local dates to the previous day in UTC+ timezones */
/* HCP exports wrap IDs as ="1-1"; the dash suffix is REQUIRED for
   uniqueness (customer-sequence numbering on older jobs) */
function cleanId(v) {
  return String(v == null ? "" : v).replace(/[^0-9-]/g, "");
}

function jobCategory(desc, amt) {

  if (/\bpatch(es)?\b/.test(s)) return "Leak Repair";

  if (/pool inspection/.test(s)) return "Pool Inspection";
  if (/deco ?seal/.test(s)) return "Deco Seal";

  if (/under the deck|under deck/.test(s)) return "Under The Deck Repair";
  if (/under the dirt|under dirt/.test(s)) return "Under The Dirt Repair";
  if (/pipe repair|underground|excavat|re-?route|skimmer/.test(s)) return "Pipe/Skimmer Repair";
  if (/structural|pier|crack|epoxy|injection/.test(s)) return "Structural";
  if (/plaster|resurfac|pebble|fiberglass|gel ?coat/.test(s)) return "Plaster/Resurface";

  if (/tile|coping/.test(s)) return "Tile & Coping";
  if (/\bdeck/.test(s)) return "Under The Deck Repair";
  if (/light/.test(s)) return "Lighting";
  if (/ld notes|leak repair|3 year no leak/.test(s)) return "Leak Repair";
  if (/leak detect|detection|leak diagnosis|water feature test/.test(s)) {
    /* your office bills repairs on detection-described jobs ("Leak Detection
       Report", $18k). Detection tops out ~$650-$1,050 even doubled; above
       $1,200 the dollars are repair work. Verified on 3,218 real jobs. */
    return amt && amt > 1200 ? "Leak Repair" : "Leak Detection";
  }
  if (/\*|notas|check notes|check pickup|pick ?up check|ayudar|fotos?\b/.test(s)) return "Internal/Tasks";
  if (/\brepair/.test(s)) return "Leak Repair";
  if (amt >= 370 && amt <= 380) return "Leak Detection";
  return s ? "Other" : "No description";
}

/* line-item categorizer: price-book names are specific, so no amount

  if (/pump|filter|heater|salt|chlorinat|actuator|automation|timer|valve|motor|manifold|gfci|electric|control system|aqualink|hayward|pentair|jandy|diving board|hand ?rail|chair lift|blower|backwash|\bunion|o.?ring|impeller|transformer|freeze protect|sensor|cleaner line|dolphin/.test(s)) return "Equipment";
  if (/plaster|pebble|gel ?coat|fiberglass|resurfac/.test(s)) return "Plaster/Resurface";

  if (/light/.test(s)) return "Lighting";
  if (/remodel|renovat/.test(s)) return "Remodel";
  return jobCategory(s, 0);
}

function computeKathy(rows, [a, b]) {
  const inR = (rows || []).filter((r) => { const t = new Date(r.d + "T12:00:00"); return t >= a && t <= b; });
  const out = { screened: inR.length, real: 0, realTransferred: 0, realFailed: 0, realMissed: 0, spamBlocked: 0, spamPassed: 0, unknown: 0, missedList: [], failedList: [], passedList: [] };
  inR.forEach((r) => {
    if (r.intent === "real") {
      out.real++;
      if (r.transferred) out.realTransferred++;
      else if (r.attempted) { out.realFailed++; out.failedList.push(r); }
      else { out.realMissed++; out.missedList.push(r); }
    } else if (r.intent === "spam") {
      if (r.transferred || r.attempted) { out.spamPassed++; out.passedList.push(r); }
      else out.spamBlocked++;
    } else out.unknown++;
  });
  out.accuracy = out.real ? (out.realTransferred / out.real) * 100 : null;
  out.spamCatch = (out.spamBlocked + out.spamPassed) ? (out.spamBlocked / (out.spamBlocked + out.spamPassed)) * 100 : null;
  return out;
}

const fmtPhone = (p) => (p && p.length === 10 ? `(${p.slice(0, 3)}) ${p.slice(3, 6)}-${p.slice(6)}` : p || "no caller ID");

const dkey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const lc = (s) => String(s || "").toLowerCase();

/* source buckets tuned to MPLR's actual CallRail source names */
function bucketSource(raw) {
  const s = lc(raw);
  if (!s || s === "unknown source") return "Other";
  if (/local service|lsa/.test(s)) return "LSA";
  if (/google ads|adwords|youtube/.test(s)) return "Google Ads";
  if (/yelp|reddit|facebook|instagram|social/.test(s)) return "Other Paid";
  if (/gmb|my business|maps|mplr|website|online|offline|organic|pool help|pool and spa/.test(s)) return "Organic/GBP";
  if (/plano|frisco|allen|dallas|richardson|carrollton|fort worth|mckinney|southlake|pheonix|phoenix|arlington|garland|mesquite/.test(s)) return "Organic/GBP";
  if (/direct|corporare|corporate|referral/.test(s)) return "Direct/Referral";
  return "Other";
}

/* prefer exact header matches, then partial, so "Cost" beats "Avg. cost" */
function matchHeader(headers, used, matchList) {
  for (const needle of matchList) {
    const exact = headers.find((h) => !used.has(h) && lc(h).trim() === needle);
    if (exact) return exact;
  }
  for (const needle of matchList) {
    const partial = headers.find((h) => !used.has(h) && lc(h).includes(needle));
    if (partial) return partial;
  }
  return undefined;
}

/* find the sheet + header row that best matches this source's fields */
function findTable(wb, fields) {
  const needles = fields.flatMap((f) => f.match);
  let best = null;
  wb.SheetNames.forEach((name) => {
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: "" });
    for (let r = 0; r < Math.min(aoa.length, 12); r++) {
      const row = aoa[r].map((c) => lc(c));
      const score = needles.filter((n) => row.some((cell) => cell.includes(n))).length
        + row.filter((c) => c !== "").length * 0.01;
      if (!best || score > best.score) best = { score, sheet: name, headerRow: r, aoa };
    }
  });
  if (!best || best.score < 2) return null;
  const headers = best.aoa[best.headerRow].map((h, i) => String(h || `Column ${i + 1}`).trim());
  const rows = best.aoa.slice(best.headerRow + 1)
    .filter((r) => r.some((c) => c !== "" && c !== null))
    .map((r) => Object.fromEntries(headers.map((h, i) => [h, r[i]])));
  return { headers, rows };
}

function normalizeRow(type, raw, map) {
  const get = (fid) => (map[fid] ? raw[map[fid]] : undefined);

  if (type === "ads") {
    /* Google Ads campaign reports include Total rows. "Total: Account" is the
       true monthly spend (covers campaigns hidden from the list), so prefer it;
       skip every other Total row to avoid double counting. */
    const vals = Object.values(raw).map((v) => lc(v).trim());
    const isTotalAccount = vals.some((v) => v.startsWith("total: account"));
    const isAnyTotal = vals.some((v) => v.startsWith("total:"));
    if (isAnyTotal && !isTotalAccount) return null;
    const cost = parseNum(get("cost"));
    if (cost === null) return null;
    const kind = isTotalAccount ? "ta" : "c";
    const mo = parseMonth(get("date"));
    if (mo) {
      const now = new Date();
      const isCurrentMonth = mo.y === now.getFullYear() && mo.mo === now.getMonth();
      const span = isCurrentMonth ? now.getDate() : new Date(mo.y, mo.mo + 1, 0).getDate();
      return { d: dkey(new Date(mo.y, mo.mo, 1)), span, cost, clicks: parseNum(get("clicks")) || 0, conv: parseNum(get("conversions")) || 0, kind };
    }
    const date = parseDate(get("date"));
    if (!date) return null;
    return { d: dkey(date), span: 1, cost, clicks: parseNum(get("clicks")) || 0, conv: parseNum(get("conversions")) || 0, kind };
  }

  const date = parseDate(get("date"));
  if (!date) return null;
  const base = { d: dkey(date) };

  if (type === "calls") {
    const st = lc(get("status"));
    if (st.includes("outbound")) return null; // outbound calls don't belong in inbound KPIs
    base.answered = st.includes("answer") && !st.includes("not") && !st.includes("un");
    base.abandoned = st.includes("abandon");
    base.ph = normPhone(get("phone"));
    base.tn = normPhone(get("tracking"));
    base.nn = String(get("numname") || "").trim();
    base.co = String(get("company") || "").trim();
    base.src = bucketSource(get("source"));
    base.spamTag = lc(get("tags")).includes("spam");
  }
  if (type === "jobs") {
    const amt = parseNum(get("amount"));
    base.amt = amt === null ? 0 : amt;
    const jid = cleanId(get("jid"));
    if (jid) base.jid = jid;
    const pAmt = parseNum(get("paidAmt"));
    if (pAmt !== null) base.paidAmt = pAmt;

    const pDate = parseDate(get("paidDate"));
    if (pDate) base.pd = dkey(pDate);
    base.ph = normPhone(get("phone"));
    const jdRaw = String(get("desc") || "").trim();
    if (jdRaw) base.jd = jdRaw.length > 90 ? jdRaw.slice(0, 90) : jdRaw;
    const svcCost = parseNum(get("svc"));
    if (svcCost && svcCost > 0) base.svc = svcCost;
    const st = lc(get("status"));
    const compDate = parseDate(get("completed"));
    base.cd = compDate ? dkey(compDate) : null;
    base.done = !!compDate || /complete|finish|done|paid|closed|invoiced/.test(st);
    base.srcRepeat = /repeat|referral|existing|return/.test(lc(get("source")));
  }
  if (type === "lsa") {
    const ch = lc(get("charged"));
    base.charged = ch === "" ? true : /charg|yes|true|billable/.test(ch) && !/not|un|refund|credit/.test(ch);
    base.ph = normPhone(get("phone"));
  }
  if (type === "kathy") {
    const tx = String(get("transcript") || "");
    const disc = lc(get("disc"));
    /* caller intent, judged ONLY from what the caller (User) said */
    const userText = tx.split(/Agent:/).map((seg) => {
      const u = seg.split(/User:/).slice(1).join(" ");
      return u;
    }).join(" ").toLowerCase() || tx.split(/User:/).slice(1).join(" ").toLowerCase();
    /* v3 classifier: scored, not precedence-based.
       1. Scrub identity-verification phrases — spam callers recite OUR
          business name ("have I reached mister Full Leak Repair?") and the
          name itself contains pool words. Those phrases are neutral.
       2. Count distinct strong-real vs strong-spam signals; higher count
          wins; tie or nothing = unknown. */
    const scrubbed = userText
      .replace(/(have i reached|am i speaking (with|to)|is this|reached) (mister|mr\.?|miss|ms\.?)?[^.?!]{0,50}/g, " ")
      .replace(/(mister|mr\.?) [a-z]+( [a-z]+){0,3}/g, " ");
    const REAL_PATTERNS = [
      /pool/, /leak/, /\brepair/, /quote/, /estimate/, /plaster/, /remodel/, /tile/, /deck/, /pump/, /filter/, /heater/, /spa\b/, /equipment/,
      /appointment/, /schedul/, /come (out|by)/, /technician/, /invoice/,
      /returning (a|your) call/, /call(ed)? (me|us|you) (back|earlier|yesterday)/,
      /found (you|your)/, /saw your/, /came across your/, /referred/, /neighbor/, /friend (told|said)/,
      /my (house|home|backyard|water bill|yard)/,
    ];
    const SPAM_PATTERNS = [
      /business listing/, /your listing/, /update your (business|listing|file)/, /express update/,
      /offering (my|our) services/, /line of credit/, /lending/, /\bloan\b/, /pre-?approved/, /funding/, /merchant/, /credit card processing/,
      /warranty (department|expir)/, /final notice/, /press \d/, /\birs\b/, /insurance (quote|plan)/, /solar panel/,
      /call list/, /remove me/, /\bsell(ing)?\b/, /new website/, /websites?[\s\S]{0,50}?(you want|you'?d like|like one|want one|interested)/,
      /(starting|making|installing|going|doing|offering) websites?/, /web ?design/, /redo your (site|website)/, /do you (guys )?(have|want|need) (a |one )?(website|site)/, /\bseo\b/, /google (listing|business)/,
      /marketing/, /advertis/, /promot/, /survey/, /special offer/,
      /this is \w+ (with|from) [\w ]{0,40}(lending|credit|capital|solutions|marketing|media|group|llc)/,
      /reach me (directly )?at/, /call me back at/, /(eight|nine|seven|six|five|four|three|two|one|zero)( |-)?((eight|nine|seven|six|five|four|three|two|one|zero)( |-)?){6,}/,
    ];
    const realScore = REAL_PATTERNS.filter((p) => p.test(scrubbed)).length;
    const spamScore = SPAM_PATTERNS.filter((p) => p.test(scrubbed)).length;
    let intent = "unknown";
    if (realScore > spamScore) intent = "real";
    else if (spamScore > realScore) intent = "spam";
    /* what Kathy did */
    const attempted = disc === "call_transfer" || /forward you to our dispatch|over to our dispatch|transfer you|connect you (to|with)/i.test(tx);
    const transferred = disc === "call_transfer";
    base.disc = disc;
    base.intent = intent;
    base.attempted = attempted;
    base.transferred = transferred;
    base.ph = normPhone(get("from"));
    const durS = String(get("duration") || "");
    const dm = durS.match(/^(\d+):(\d{2})$/);
    base.dur = dm ? Number(dm[1]) * 60 + Number(dm[2]) : parseNum(durS) || 0;
    base.tx = tx.length > 2000 ? tx.slice(0, 2000) + "…" : tx;
    const cid = String(get("cid") || "").trim();
    if (cid) base.cid = cid;
    const rec = String(get("rec") || "").trim();
    if (/^https?:\/\//.test(rec)) base.rec = rec;
  }
  if (type === "estimates") {
    const outcome = lc(get("outcome"));
    const st = lc(get("status"));
    if (outcome) {
      /* HCP Outcome column is the decision of record: open / won / lost */
      base.closed = outcome !== "open";
    } else {
      /* no Outcome column: pending language wins; else a decision word closes */
      const pending = /pending|submit|sent|await|open|draft|review/.test(st);
      base.closed = !pending && /approv|won|convert|copied|decline|lost|expire|dismiss|cancel|closed|invoiced|scheduled/.test(st);
    }
    base.st = String(get("status") || "").trim() || outcome;
    if (outcome) base.oc = outcome;
    base.amt = parseNum(get("amount")) || parseNum(get("wonval")) || 0;
    base.nm = String(get("name") || "").trim();
    base.ph = normPhone(get("phone"));
    const clip = (v, n) => { const s = String(v || "").trim(); return s.length > n ? s.slice(0, n) + "…" : s; };
    base.desc = clip(get("desc"), 200);
    base.addr = clip(get("addr"), 120);
    base.notes = clip(get("notes"), 400);
    const eid = String(get("eid") || "").replace(/\D/g, "");
    if (eid) base.eid = eid;
  }
  if (type === "lsabill") {
    const amt = parseNum(get("amount"));
    if (amt === null) return null;
    base.cost = amt;
  }
  return base;
}

/* smart default for the number picker: human-answered lines in, Kathy's public lines out */
function defaultInclude(nn, co) {
  if (/not spam/i.test(nn)) return true;
  if (/my company/i.test(co)) return true;
  return false;
}

/* ---------------- date ranges ---------------- */

const PRESETS = [
  { id: "mtd", label: "MTD" }, { id: "l7", label: "Last 7" }, { id: "l30", label: "Last 30" },
  { id: "l90", label: "Last 90" }, { id: "qtd", label: "QTD" }, { id: "ytd", label: "YTD" },
  { id: "all", label: "All" }, { id: "custom", label: "Custom" },
];


function ctNow() {
  /* the business runs on Dallas time; pin every date range to America/Chicago
     no matter where the viewer sits */
  return new Date(new Date().toLocaleString("en-US", { timeZone: "America/Chicago" }));
}
function presetRange(id, allDates) {
  const today = ctNow(); today.setHours(23, 59, 59, 999);
  const start = new Date(today);
  if (id === "mtd") start.setDate(1);
  else if (id === "l7") start.setDate(start.getDate() - 6);
  else if (id === "l30") start.setDate(start.getDate() - 29);
  else if (id === "l90") start.setDate(start.getDate() - 89);
  else if (id === "qtd") start.setMonth(Math.floor(start.getMonth() / 3) * 3, 1);
  else if (id === "ytd") start.setMonth(0, 1);
  else if (id === "all") {
    if (allDates.length) return [new Date(allDates[0] + "T00:00:00"), today];
    start.setFullYear(start.getFullYear() - 1);
  }
  start.setHours(0, 0, 0, 0);
  return [start, today];
}

const inRange = (dstr, [a, b]) => {
  const t = new Date(dstr + "T12:00:00");
  return t >= a && t <= b;
};

function adsCostInRange(rows, [a, b]) {
  let total = 0, clicks = 0;
  rows.forEach((r) => {
    const rs = new Date(r.d + "T00:00:00");
    const re = new Date(rs); re.setDate(re.getDate() + r.span - 1); re.setHours(23, 59, 59, 999);
    const s = Math.max(rs.getTime(), a.getTime());
    const e = Math.min(re.getTime(), b.getTime());
    if (e < s) return;
    const frac = Math.min(1, (Math.round((e - s) / 86400000) + 1) / r.span);
    total += r.cost * frac;
    clicks += (r.clicks || 0) * frac;
  });
  return { cost: total, clicks: Math.round(clicks) };
}

/* LSA spend: billing rows win for any month they cover; typed monthly
   spend fills the months without billing data, prorated across the range */
function lsaSpendInRange(manual, [a, b], bills) {
  const billRows = bills || [];
  const billedMonths = {};
  billRows.forEach((r) => { billedMonths[r.d.slice(0, 7)] = true; });
  let total = 0;
  billRows.forEach((r) => { if (inRange(r.d, [a, b])) total += r.cost; });
  Object.entries(manual).forEach(([mk, vals]) => {
    if (billedMonths[mk]) return;
    const spend = parseNum(vals && vals.lsaSpend);
    if (!spend) return;
    const [y, mo] = mk.split("-").map(Number);
    const ms = new Date(y, mo - 1, 1);
    const me = new Date(y, mo, 0); me.setHours(23, 59, 59, 999);
    const daysInMonth = me.getDate();
    const s = Math.max(ms.getTime(), a.getTime());
    const e = Math.min(me.getTime(), b.getTime());
    if (e < s) return;
    const overlapDays = Math.round((e - s) / 86400000) + 1;
    total += spend * Math.min(1, overlapDays / daysInMonth);
  });
  return total;
}

/* ---------------- metric computation ---------------- */

function buildPhoneIndex(jobs) {
  const idx = {};
  jobs.forEach((j) => {
    if (!j.ph) return;
    (idx[j.ph] = idx[j.ph] || []).push(j.d);
  });
  Object.values(idx).forEach((arr) => arr.sort());
  return idx;
}

function computeStats(data, range, numFilter, manual) {
  const phoneIdx = data._phoneIdx || buildPhoneIndex(data.jobs);
  const included = (c) => (c.tn ? numFilter[c.tn] !== false : true);
  const calls = data.calls.filter((c) => inRange(c.d, range) && included(c) && !c.spamTag);

  /* phone-verified LSA attribution: a caller whose number appears in the
     LSA lead exports is an LSA lead, whatever the CallRail source says */
  const lsaIdx = {};
  (data.lsa || []).forEach((r) => { if (r.ph) (lsaIdx[r.ph] = lsaIdx[r.ph] || []).push(r.d); });

  const classified = calls.map((c) => {
    const jobDates = c.ph ? phoneIdx[c.ph] || [] : [];
    const callT = new Date(c.d + "T00:00:00").getTime();
    let booked = false, existing = false;
    for (const jd of jobDates) {
      const jt = new Date(jd + "T00:00:00").getTime();
      if (jt < callT) existing = true;
      else if (jt <= callT + ATTRIBUTION_DAYS * 86400000) booked = true;
    }
    let src = c.src;
    if (c.ph && lsaIdx[c.ph] && lsaIdx[c.ph].some((ld) => {
      const lt = new Date(ld + "T00:00:00").getTime();
      return lt >= callT - 30 * 86400000 && lt <= callT + 86400000;
    })) src = "LSA";
    return { ...c, src, booked, existing: existing && !booked };
  });

  const total = classified.length;
  const answered = classified.filter((c) => c.answered).length;
  const abandoned = classified.filter((c) => c.abandoned).length;

  const leads = classified.filter((c) => !c.existing);
  const bySrc = {};
  leads.forEach((c) => { bySrc[c.src] = (bySrc[c.src] || 0) + 1; });
  const booked = leads.filter((c) => c.booked).length;
  const answeredLeads = leads.filter((c) => c.answered).length;
  const bookedAnsweredLeads = leads.filter((c) => c.answered && c.booked).length;

  /* revenue = money collected: jobs by paid-in-full date and paid amount
     when the export carries them; falls back to completed jobs otherwise */
  const hasPaidData = data.jobs.some((j) => j.pd);
  const revenueJobs = hasPaidData
    ? data.jobs.filter((j) => j.pd && inRange(j.pd, range))
    : data.jobs.filter((j) => j.done && inRange(j.cd || j.d, range));
  const revenue = revenueJobs.reduce((a, j) => a + (j.paidAmt != null ? j.paidAmt : j.amt), 0);
  const repeatJobs = revenueJobs.filter((j) => {
    if (j.srcRepeat) return true;
    const dates = j.ph ? phoneIdx[j.ph] || [] : [];
    return dates.length > 0 && dates[0] < j.d;
  }).length;

  const { cost: adsCost, clicks: adsClicks } = adsCostInRange(data.ads, range);
  const lsaRows = data.lsa.filter((r) => inRange(r.d, range));
  const lsaCharged = lsaRows.filter((r) => r.charged);
  const lsaCost = lsaSpendInRange(manual || {}, range, data.lsabill || []);

  /* month-matched CPL: only months with known spend (billing or typed)
     count in the cost-per-lead math; uncovered months are excluded from
     both sides instead of diluting the number */
  const spendMonths = new Set((data.lsabill || []).map((r) => r.d.slice(0, 7)));
  Object.entries(manual || {}).forEach(([mk, v]) => { if (parseNum(v && v.lsaSpend)) spendMonths.add(mk); });
  const lsaChargedCovered = lsaCharged.filter((r) => spendMonths.has(r.d.slice(0, 7)));
  const lsaBillRowsInRange = (data.lsabill || []).filter((r) => inRange(r.d, range)).length;

  const adsLeads = bySrc["Google Ads"] || 0;
  const lsaLeads = lsaChargedCovered.length || bySrc["LSA"] || 0;
  const paidSpend = adsCost + lsaCost;
  const paidBooked = leads.filter((c) => c.booked && (c.src === "Google Ads" || c.src === "LSA")).length;
  const topPaid = Math.max(bySrc["Google Ads"] || 0, bySrc["LSA"] || 0);

  /* per-source performance: leads → booked → dollars collected.
     Revenue is attributed to the source of the customer's latest call
     in the 30 days before the job was created. */
  /* all-time call index (included lines, non-spam): used for follow-up
     checks and for revenue attribution */
  const callIdxAll = {};
  data.calls.forEach((c) => {
    if (!included(c) || c.spamTag || !c.ph) return;
    let src = c.src;
    if (lsaIdx[c.ph]) {
      const ct = new Date(c.d + "T00:00:00").getTime();
      if (lsaIdx[c.ph].some((ld) => { const lt = new Date(ld + "T00:00:00").getTime(); return lt >= ct - 30 * 86400000 && lt <= ct + 86400000; })) src = "LSA";
    }
    (callIdxAll[c.ph] = callIdxAll[c.ph] || []).push({ d: c.d, src, answered: c.answered });
  });

  const callIdx = callIdxAll;
  const srcPerf = {};
  const bump = (s, k, v = 1) => { (srcPerf[s] = srcPerf[s] || { leads: 0, booked: 0, revenue: 0, jobs: 0 })[k] += v; };
  leads.forEach((c) => { bump(c.src, "leads"); if (c.booked) bump(c.src, "booked"); });
  revenueJobs.forEach((j) => {
    let s = "No matched call";
    const jt = new Date(j.d + "T00:00:00").getTime();
    if (j.ph && callIdx[j.ph]) {
      const cands = callIdx[j.ph].filter((c) => { const ct = new Date(c.d + "T00:00:00").getTime(); return ct <= jt && ct >= jt - 30 * 86400000; });
      if (cands.length) s = cands[cands.length - 1].src;
    }
    /* no call on record: check the LSA leads sheet directly by phone —
       message leads and untracked calls still credit LSA when the same
       number appears as an LSA lead within 30 days before the job */
    if (s === "No matched call" && j.ph && lsaIdx[j.ph]) {
      const hit = lsaIdx[j.ph].some((ld) => { const lt = new Date(ld + "T00:00:00").getTime(); return lt <= jt && lt >= jt - 30 * 86400000; });
      if (hit) s = "LSA";
    }
    bump(s, "revenue", j.paidAmt != null ? j.paidAmt : j.amt); bump(s, "jobs");
  });

  /* missed opportunities: TRULY lost callers. One row per phone number,
     only if: their call in this range was missed, they never got answered
     on ANY later call (whole history, not just this range), and no job
     was ever created for them afterward. Someone who called back and got
     through does not belong on a callback list. */
  const missedByPhone = {};
  classified.forEach((c) => {
    if (c.existing || c.answered || c.booked || !c.ph) return;
    const prevEntry = missedByPhone[c.ph];
    if (!prevEntry || c.d > prevEntry.d) missedByPhone[c.ph] = { d: c.d, ph: c.ph, src: c.src };
  });
  const missedOps = Object.values(missedByPhone)
    .filter((m) => {
      /* same-day counts: dates carry no clock time, so an answered call on
         the SAME day as the miss means they reached you — not a lost caller */
      const reachedLater = (callIdxAll[m.ph] || []).some((c) => c.d >= m.d && c.answered);
      const becameCustomer = (phoneIdx[m.ph] || []).some((jd) => jd >= m.d);
      return !reachedLater && !becameCustomer;
    })
    .sort((a, b) => (a.d < b.d ? 1 : -1));

  let wkdayTot = 0, wkdayAns = 0, wkendTot = 0, wkendAns = 0;
  classified.forEach((c) => {
    const day = new Date(c.d + "T12:00:00").getDay();
    if (day === 0 || day === 6) { wkendTot++; if (c.answered) wkendAns++; }
    else { wkdayTot++; if (c.answered) wkdayAns++; }
  });

  /* sales by service type: ONE source — the jobs export (description +
     paid amount in the same row, no joins to break). The invoices export,
     when loaded, serves as an independent cross-check on the total. */
  const catPerf = {};
  const catSeen = {};
  const bumpCat = (c, rev, jid, svc, jref) => {
    if (!catPerf[c]) { catPerf[c] = { jobs: 0, revenue: 0, svc: 0, svcJobs: 0, members: [] }; catSeen[c] = new Set(); }
    /* a category counts every DISTINCT job containing that work — a
       detection+seal job counts in both, which is the honest read of
       "how many jobs included this" */
    const firstTouch = jid && !catSeen[c].has(jid);
    if (firstTouch) { catSeen[c].add(jid); catPerf[c].jobs++; if (svc) { catPerf[c].svc += svc; catPerf[c].svcJobs++; } }
    catPerf[c].revenue += rev;
    if (jref) catPerf[c].members.push(jref);
  };
  let catLi = 0, catTot = 0;
  revenueJobs.forEach((j) => {
    const jobRev = j.paidAmt != null ? j.paidAmt : j.amt;
    catTot++;
    if (j.li && j.li.length) {
      const liSum = j.li.reduce((a, x) => a + (x.amt || 0), 0);
      /* HARD RULE: report/summary/doc lines never carry dollars. Job money
         allocates across real WORK lines only; a doc line holding dollars
         (bad quantity data) hands them to the named work. */
      const docRe = /leak diagnosis|leak detection report|leak detection summary|\bld notes\b/;
      /* adjustments modify invoices, they aren't services — their dollars
         belong to the real work lines on the same job */
      const adjRe = /discount|gratuity|processing fee|cc fee|credit card|\btaxes?\b|refund|\bcredit\b|already paid|paid already|payment (made|already|on)|wisetack|transfer to|water bill|\breview\b|inconvenience|^item$|\bdeposit\b|prepaid|deductible|price match|no access trip|drain(ed)? (own|his|him|yourself|your own)|will drain|client.{0,10}drain|customer.{0,12}drain|pool drained|self.?drained|pre.?drained|drained (pool|himself|own)|friendly (customer|senior|teacher|veteran|military|neighbor|child|discount)|military|veteran|senior citizen|first responder|teacher\b|\bfamily\b|approved by cassandra|per cassandra|fixed gratuity/;
      const isDoc = (nm) => docRe.test(String(nm).toLowerCase());
      const isAdj = (nm) => adjRe.test(String(nm).toLowerCase());
      const work = j.li.filter((x) => !isDoc(x.n) && !isAdj(x.n));
      const workSum = work.reduce((a, x) => a + Math.max(0, x.amt || 0), 0);
      if (workSum > 0 && jobRev > 0) {
        catLi++;
        const scale = jobRev / workSum;
        work.forEach((x) => {
          const raw = Math.max(0, x.amt || 0);
          if (raw <= 0) return; /* $0 ancillary lines: category comes from the paid lines */
          const sc = Math.round(raw * scale);
          bumpCat(liCategory(x.n, sc), raw * scale, j.jid, j.svc, { ...j, jd: x.n, amt: sc, paidAmt: sc });
        });
        return;
      }
      if (jobRev > 0 && work.length) {
        /* all dollars sat on doc lines — give them to the named work when unambiguous */
        const workCats = [...new Set(work.map((x) => liCategory(x.n, jobRev)))];
        if (workCats.length === 1) {
          catLi++;
          bumpCat(workCats[0], jobRev, j.jid, j.svc, { ...j, jd: work[0].n, amt: Math.round(jobRev), paidAmt: Math.round(jobRev) });
          return;
        }
      }
      if (jobRev > 0 && j.li.length && !work.length) {
        /* invoice holds ONLY report/doc lines — nothing names the work */
        bumpCat(jobCategory(j.jd, j.amt), jobRev, j.jid, j.svc, { ...j, jd: (j.jd || "(no description)") + " — invoice has only report lines, no work line", amt: Math.round(jobRev), paidAmt: Math.round(jobRev) });
        return;
      }
    }
    bumpCat(jobCategory(j.jd, j.amt), jobRev, j.jid, j.svc, { ...j, noLi: true });
  });

  return {
    catLi, catTot,
    srcPerf,
    catPerf,
    missedOps,
    split: { wkdayTot, wkdayAns, wkendTot, wkendAns },
    counts: {
      calls: total, jobs: revenueJobs.length, lsaRows: lsaCharged.length, paidBasis: hasPaidData, lsaCoveredLeads: lsaChargedCovered.length, adsCost, adsLeads, lsaCost, paidSpend, paidBooked, lsaBillRows: lsaBillRowsInRange, adsClicks,
      unmatchedPhones: classified.filter((c) => !c.ph).length,
    },
    values: {
      answerRate: total ? (answered / total) * 100 : null,
      abandonRate: total ? (abandoned / total) * 100 : null,
      bookingRate: answeredLeads ? (bookedAnsweredLeads / answeredLeads) * 100 : null,
      leadsTotal: leads.length || null,
      convRate: leads.length ? (booked / leads.length) * 100 : null,
      cplAds: adsLeads && adsCost ? adsCost / adsLeads : null,
      cplLsa: lsaLeads && lsaCost ? lsaCost / lsaLeads : null,
      cpbj: paidBooked && paidSpend ? paidSpend / paidBooked : null,
      avgTicket: revenueJobs.length ? revenue / revenueJobs.length : null,
      roas: paidSpend ? revenue / paidSpend : null,
      concentration: leads.length ? (topPaid / leads.length) * 100 : null,
      repeatRate: revenueJobs.length ? (repeatJobs / revenueJobs.length) * 100 : null,
    },
    bySrc,
  };
}

const SECTIONS = [
  { id: "calls", label: "Call Handling", owner: "Dispatcher review" },
  { id: "mkt", label: "Lead & Marketing", owner: "" },
];

const fmtVal = (m, v) => {
  if (v === undefined || v === null) return "—";
  if (m.mode === "select") { const o = m.options.find((o) => o.value === v); return o ? o.label : "—"; }
  const n = Number(v);
  if (Number.isNaN(n)) return "—";
  if (m.unit === "$") return "$" + n.toLocaleString(undefined, { maximumFractionDigits: n >= 100 ? 0 : 2 });
  if (m.unit === ":1") return n.toLocaleString(undefined, { maximumFractionDigits: 1 }) + ":1";
  return n.toLocaleString(undefined, { maximumFractionDigits: 1 }) + (m.unit ? " " + m.unit : "");
};

/* ================================================================ */

function App() {
  const [data, setData] = useState({ calls: [], jobs: [], ads: [], lsa: [], lsabill: [], estimates: [], kathy: [], followups: {}, settings: {}, manual: {}, numFilter: {}, numMeta: {}, mapMemory: {} });
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("overview");
  const [preset, setPreset] = useState("mtd");
  const [customA, setCustomA] = useState("");
  const [customB, setCustomB] = useState("");
  const [saveState, setSaveState] = useState("");
  const [pendingList, setPendingList] = useState([]);
  const [uploadMsg, setUploadMsg] = useState(null);
  const [loadErr, setLoadErr] = useState(null);
  const [trendMetric, setTrendMetric] = useState("answerRate");
  const [showAccuracy, setShowAccuracy] = useState(false);
  const [showLsaManual, setShowLsaManual] = useState(false);
  const [theme, setTheme] = useState(() => { try { return localStorage.getItem("mplr-theme") || "light"; } catch (e) { return "light"; } });
  const toggleTheme = () => { const t = theme === "light" ? "dark" : "light"; setTheme(t); try { localStorage.setItem("mplr-theme", t); } catch (e) {} };
  const C = theme === "light" ? LIGHT : DARK;
  const STATUS_META = {
    green: { label: "Green", color: C.green },
    yellow: { label: "Yellow", color: C.yellow },
    red: { label: "Red", color: C.red },
    baseline: { label: "Baseline", color: C.gray },
    empty: { label: "No data", color: C.gray },
    manual: { label: "Manual", color: C.gray },
  };
  const fileRefs = { calls: useRef(), jobs: useRef(), ads: useRef(), lsa: useRef(), lsabill: useRef(), estimates: useRef(), kathy: useRef() };
  const backupRef = useRef();

  useEffect(() => {
    (async () => {
      let fromStore = false;
      try {
        const r = await store.get(STORAGE_KEY);
        if (r && r.value) {
          const parsed = JSON.parse(r.value);
          setData({ calls: [], jobs: [], ads: [], lsa: [], lsabill: [], estimates: [], kathy: [], followups: {}, settings: {}, manual: {}, numFilter: {}, numMeta: {}, mapMemory: {}, ...parsed });
          fromStore = true;
        }
      } catch (e) { if (e && e.loadFail) setLoadErr(e.message); }
      /* embedded default dataset: used whenever nothing is saved in this
         browser (e.g. Google Sites). Saved data always wins over it. */
      if (!fromStore && typeof window !== "undefined" && window.MPLR_DEFAULT_DATA) {
        setData({ calls: [], jobs: [], ads: [], lsa: [], lsabill: [], estimates: [], kathy: [], followups: {}, settings: {}, manual: {}, numFilter: {}, numMeta: {}, mapMemory: {}, ...window.MPLR_DEFAULT_DATA });
      }
      setLoaded(true);
    })();
  }, []);

  const persist = async (next) => {
    setData(next);
    setSaveState("saving");
    try {
      const { _phoneIdx, ...toSave } = next;
      await store.set(STORAGE_KEY, JSON.stringify(toSave));
      setSaveState("saved");
      setTimeout(() => setSaveState(""), 1500);
    } catch (e) { setSaveState("error"); setUploadMsg({ ok: false, text: "⚠ SAVE FAILED — nothing stored on the server: " + e.message }); }
  };

  const allDates = useMemo(
    () => [...data.calls, ...data.jobs, ...data.ads, ...data.lsa, ...(data.lsabill || []), ...(data.estimates || [])].map((r) => r.d).sort(),
    [data]
  );
  const range = useMemo(() => {
    if (preset === "custom" && customA && customB)
      return [new Date(customA + "T00:00:00"), new Date(customB + "T23:59:59")];
    return presetRange(preset === "custom" ? "l30" : preset, allDates);
  }, [preset, customA, customB, allDates]);

  const prevRange = useMemo(() => {
    const [a, b] = range;
    const len = b.getTime() - a.getTime();
    return [new Date(a.getTime() - len - 1), new Date(a.getTime() - 1)];
  }, [range]);

  const dataIdx = useMemo(() => ({ ...data, _phoneIdx: buildPhoneIndex(data.jobs) }), [data]);
  const cur = useMemo(() => computeStats(dataIdx, range, data.numFilter, data.manual), [dataIdx, range, data.numFilter, data.manual]);
  const prev = useMemo(() => computeStats(dataIdx, prevRange, data.numFilter, data.manual), [dataIdx, prevRange, data.numFilter, data.manual]);

  const monthKey = dkey(range[1]).slice(0, 7);
  const manualFor = data.manual[monthKey] || {};
  const setManual = (id, v) => persist({ ...data, manual: { ...data.manual, [monthKey]: { ...manualFor, [id]: v } } });
  const setManualMonth = (mk, id, v) => persist({ ...data, manual: { ...data.manual, [mk]: { ...(data.manual[mk] || {}), [id]: v } } });

  /* every month the current range touches (for per-month LSA spend entry) */
  const rangeMonths = useMemo(() => {
    const out = [];
    const d = new Date(range[0].getFullYear(), range[0].getMonth(), 1);
    while (d <= range[1] && out.length < 13) {
      out.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
      d.setMonth(d.getMonth() + 1);
    }
    return out;
  }, [range]);

  const trackingNumbers = useMemo(() => {
    const counts = {};
    data.calls.forEach((c) => { if (c.tn) counts[c.tn] = (counts[c.tn] || 0) + 1; });
    return Object.entries(counts)
      .map(([tn, count]) => ({ tn, count, ...(data.numMeta[tn] || {}) }))
      .sort((a, b) => b.count - a.count);
  }, [data.calls, data.numMeta]);

  const toggleNumber = (tn) => {
    const inc = data.numFilter[tn] !== false;
    persist({ ...data, numFilter: { ...data.numFilter, [tn]: inc ? false : true } });
  };

  /* ---------- scoring ---------- */
  const scored = useMemo(() => {
    return METRICS.map((m) => {
      let value, status = "empty", note = null;
      if (m.mode === "manual") {
        value = manualFor[m.id];
        status = value === undefined || value === "" ? "manual" : m.score(Number(value));
        if (status === "manual") note = "Enter this month's number below";
      } else if (m.mode === "select") {
        value = manualFor[m.id];
        const o = value && m.options.find((o) => o.value === value);
        status = o ? o.status : "manual";
        if (!o) note = "Set this month's status below";
      } else {
        value = cur.values[m.id];
        const pv = prev.values[m.id];
        if (value === null || value === undefined) {
          status = "empty";
          if (m.id === "cplLsa" && cur.counts.lsaRows > 0) note = "Charged leads found, but no spend data for their months. Upload LSA billing files.";
          if (m.id === "cplAds") {
            if (!cur.counts.adsCost) note = "No Google Ads cost in this range. Upload a Campaign report covering these months (Upload tab).";
            else if (!cur.counts.adsLeads) note = "Ads spend found, but no calls attributed to Google Ads in this range. Check the CallRail upload and the number list.";
          }
        }
        else if (m.mode === "vsPrevLow") {
          if (pv == null) { status = "baseline"; note = "No prior-period data yet"; }
          else { status = value <= pv ? "green" : value <= pv * 1.15 ? "yellow" : "red"; note = "Prior period " + fmtVal(m, pv); }
        } else if (m.mode === "vsPrevHigh") {
          if (pv == null) { status = "baseline"; note = "No prior-period data yet"; }
          else { status = value >= pv ? "green" : value >= pv * 0.9 ? "yellow" : "red"; note = "Prior period " + fmtVal(m, pv); }
        } else if (m.mode === "vsPrevGrow") {
          if (!pv) { status = "baseline"; note = "No prior-period data yet"; }
          else {
            const chg = ((value - pv) / pv) * 100;
            status = chg >= 0 ? "green" : chg >= -15 ? "yellow" : "red";
            note = (chg >= 0 ? "+" : "") + chg.toFixed(0) + "% vs. prior period";
          }
        } else status = m.score(value);
      }
      let delta = null;
      const pv = prev.values[m.id];
      if (!m.mode && value != null && pv != null && pv !== 0) delta = ((value - pv) / Math.abs(pv)) * 100;
      /* show the actual division on the cost cards so bad inputs are obvious */
      if (value != null) {
        const k = cur.counts;
        let math = null;
        if (m.id === "cplAds") math = `$${Math.round(k.adsCost).toLocaleString()} ÷ ${k.adsLeads} Ads leads`;
        if (m.id === "cplLsa") math = `$${Math.round(k.lsaCost).toLocaleString()} spend (${k.lsaBillRows} billing rows) ÷ ${k.lsaCoveredLeads} charged leads · spend must cover ALL LSA accounts`;
        if (m.id === "cpbj") math = `$${Math.round(k.paidSpend).toLocaleString()} paid spend ÷ ${k.paidBooked} booked paid-source leads`;
        if (math) note = note ? `${math} · ${note}` : math;
      }
      return { metric: m, value, status, note, delta };
    });
  }, [cur, prev, manualFor]);

  /* the server AI-grades new transcripts automatically ~2s after upload;
     poll briefly whenever ungraded rows exist so verdicts refresh on their own */
  useEffect(() => {
    if (!SERVER_MODE) return;
    const pending = (data.kathy || []).some((r) => !r.ai && r.cid && r.tx);
    if (!pending) return;
    let tries = 0;
    const t = setInterval(async () => {
      tries++;
      if (tries > 12) { clearInterval(t); return; }
      try {
        const d = await fetch("/api/data").then((x) => x.json());
        const stillPending = (d.kathy || []).some((r) => !r.ai && r.cid && r.tx);
        if (!stillPending) {
          clearInterval(t);
          setData({ calls: [], jobs: [], ads: [], lsa: [], lsabill: [], estimates: [], kathy: [], followups: {}, settings: {}, manual: {}, numFilter: {}, numMeta: {}, mapMemory: {}, ...d });
        }
      } catch (e) { /* keep trying */ }
    }, 10000);
    return () => clearInterval(t);
  }, [SERVER_MODE ? (data.kathy || []).filter((r) => !r.ai && r.cid && r.tx).length : 0]);

  const kathyCur = useMemo(() => computeKathy(data.kathy, range), [data.kathy, range]);
  const kathyPrev = useMemo(() => computeKathy(data.kathy, prevRange), [data.kathy, prevRange]);
  const [openKathyRow, setOpenKathyRow] = useState(null);
  const [kathyFilter, setKathyFilter] = useState("all");
  const [kathySearch, setKathySearch] = useState("");
  const [showAllKathy, setShowAllKathy] = useState(false);

  /* phone comes ONLY from the estimate's own row (the export's phone
     column) — never inferred from names, which collide */
  const estPhone = (e) => e.ph || "";
  const logTouch = (eid, kind) => {
    if (!eid) return;
    const f = { ...(data.followups || {}) };
    const curF = f[eid] || { n: 0, t: 0 };
    f[eid] = { ...curF, [kind]: (curF[kind] || 0) + 1, last: dkey(new Date()) };
    persist({ ...data, followups: f });
  };
  const logCall = (eid) => logTouch(eid, "n");
  const logText = (eid) => logTouch(eid, "t");
  const saveEstNote = (eid, note) => {
    if (!eid) return;
    const f = { ...(data.followups || {}) };
    f[eid] = { ...(f[eid] || { n: 0, t: 0 }), note };
    persist({ ...data, followups: f });
  };

  /* open estimates: pending right now, converted-by-phone treated as closed */
  const openEstimates = useMemo(() => {
    const lo = dkey(range[0]), hi = dkey(range[1]);
    const est = (data.estimates || []).filter((e) => e.d && e.d >= lo && e.d <= hi);
    if (!est.length) return null;
    const phoneIdx = dataIdx._phoneIdx || {};
    const today = Date.now();
    const allOpen = est.filter((e) => {
      if (e.closed) return false;
      if (e.ph && (phoneIdx[e.ph] || []).some((jd) => jd >= e.d)) return false; // job created after → converted
      return true;
    }).map((e) => ({ ...e, age: Math.floor((today - new Date(e.d + "T12:00:00").getTime()) / 86400000) }));
    const open = allOpen;
    const dead = 0;
    const totalVal = open.reduce((a, e) => a + (e.amt || 0), 0);
    const buckets = { fresh: 0, warm: 0, stale: 0 };
    open.forEach((e) => { if (e.age <= 7) buckets.fresh++; else if (e.age <= 30) buckets.warm++; else buckets.stale++; });
    const phMissing = est.length > 0 && est.every((e) => !e.ph);
    const amtMissing = est.length > 0 && est.every((e) => !e.amt);
    return { open: open.sort((a, b) => a.age - b.age), totalVal, buckets, total: est.length, dead, phMissing, amtMissing };
  }, [data.estimates, dataIdx, range]);

  /* ---------- insights & recommendations (computed from the data) ---------- */
  const insights = useMemo(() => {
    const v = cur.values, pv = prev.values, out = [];
    const push = (sev, title, detail, action) => out.push({ sev, title, detail, action });
    const money = (n) => "$" + Math.round(n).toLocaleString();

    const mo = cur.missedOps || [];
    if (mo.length) {
      const conv = (v.bookingRate || 0) / 100;
      const est = mo.length * conv * (v.avgTicket || 0);
      push(mo.length > 20 ? "red" : "yellow",
        `${mo.length} callers were missed and never reached you again`,
        est > 0 ? `At your ${(v.bookingRate || 0).toFixed(0)}% booking rate and ${money(v.avgTicket || 0)} average ticket, that's roughly ${money(est)} in bookings left on the table this period.` : `Each of these is a potential job that called and got nothing.`,
        "Work the callback list below: these numbers called you.");
    }
    const sp = cur.split || {};
    if (sp.wkendTot >= 20 && sp.wkdayTot >= 20) {
      const we = (sp.wkendAns / sp.wkendTot) * 100, wd = (sp.wkdayAns / sp.wkdayTot) * 100;
      if (wd - we >= 10) push("yellow",
        `Weekend answer rate ${we.toFixed(0)}% vs ${wd.toFixed(0)}% on weekdays`,
        `${sp.wkendTot - sp.wkendAns} weekend calls went unanswered this period.`,
        "Add weekend coverage or make sure the missed-call text-back is on for weekends.");
    }
    const overall = v.convRate || 0;
    Object.entries(cur.srcPerf || {}).forEach(([s, p]) => {
      if (s === "No matched call" || p.leads < 15) return;
      const rate = (p.booked / p.leads) * 100;
      if (rate < overall * 0.6) push("yellow",
        `${s} converts at ${rate.toFixed(0)}% vs ${overall.toFixed(0)}% overall`,
        `${p.leads} leads produced only ${p.booked} bookings.`,
        s.includes("Paid") || s === "Google Ads" || s === "LSA" ? "Review what this channel costs before renewing spend." : "Check how these calls are being handled.");
    });
    const best = Object.entries(cur.srcPerf || {}).filter(([s, p]) => s !== "No matched call" && p.leads >= 15).sort((a, b) => (b[1].booked / b[1].leads) - (a[1].booked / a[1].leads))[0];
    if (best) {
      const rate = (best[1].booked / best[1].leads) * 100;
      if (rate > overall * 1.2) push("green",
        `${best[0]} is your best converter at ${rate.toFixed(0)}%`,
        `${best[1].leads} leads, ${best[1].booked} booked, ${money(best[1].revenue)} collected.`,
        "If it's a paid channel, this is where extra budget earns most.");
    }
    if (v.roas != null && v.roas < 3) push("red",
      `ROAS is ${v.roas.toFixed(1)}:1, below the 3:1 floor`,
      `Collected revenue isn't covering paid spend at a healthy multiple this period. Revenue lags bookings, so recent periods read low, but a sustained sub-3 needs action.`,
      "Check the Compare tab against last month before cutting; then push budget toward the best-converting source above.");
    if (v.avgTicket != null && pv.avgTicket != null && v.avgTicket < pv.avgTicket * 0.9) push("yellow",
      `Average job value down ${(100 - (v.avgTicket / pv.avgTicket) * 100).toFixed(0)}% vs prior period`,
      `${money(v.avgTicket)} now vs ${money(pv.avgTicket)} before.`,
      "Check the job mix: more detections and fewer repairs pulls this down.");
    if (v.leadsTotal != null && pv.leadsTotal && v.leadsTotal < pv.leadsTotal * 0.85) push("red",
      `Lead volume down ${(100 - (v.leadsTotal / pv.leadsTotal) * 100).toFixed(0)}% vs prior period`,
      `${v.leadsTotal} new-business leads vs ${pv.leadsTotal} before.`,
      "Check spend levels and GBP visibility before it hits revenue.");
    if (v.concentration != null && v.concentration > 60) push(v.concentration > 80 ? "red" : "yellow",
      `${v.concentration.toFixed(0)}% of leads come from one paid source`,
      "A policy change or account suspension there takes most of your pipeline with it.",
      "Grow the second source before you need it.");
    if (v.repeatRate != null && v.repeatRate < 10 && (cur.counts.jobs || 0) >= 20) push("yellow",
      `Only ${v.repeatRate.toFixed(0)}% of jobs are repeat or referral`,
      "Nearly all revenue is bought new each month.",
      "A post-job review + referral ask is the cheapest lead source you're not using.");
    const nm = (cur.srcPerf || {})["No matched call"];
    const totalRev = Object.values(cur.srcPerf || {}).reduce((a, p) => a + p.revenue, 0);
    if (nm && totalRev && nm.revenue / totalRev > 0.15) push("yellow",
      `${((nm.revenue / totalRev) * 100).toFixed(0)}% of collected revenue can't be attributed to a source`,
      `${money(nm.revenue)} came from customers with no call on file (text, form, email bookings).`,
      "Have the office set the lead source field in HCP at booking for non-call jobs.");

    if (openEstimates && openEstimates.open.length) {
      const oe = openEstimates;
      push(oe.buckets.stale > 5 ? "red" : "yellow",
        `${oe.open.length} live estimates worth ${money(oe.totalVal)} awaiting a decision`,
        `${oe.buckets.stale} are 31-90 days old. Estimates don't close themselves.`,
        "Follow up oldest-first: the pipeline panel below has the list.");
    }

    if (kathyCur.screened > 0) {
      if (kathyCur.realMissed > 0) push("red",
        `Spam Kathy dismissed ${kathyCur.realMissed} real caller${kathyCur.realMissed === 1 ? "" : "s"} without transferring`,
        `Real customers were screened out. The Spam Kathy tab lists each one with the transcript.`,
        "Review the missed transcripts and tighten the agent prompt.");
      if (kathyCur.realFailed > 0) push("yellow",
        `${kathyCur.realFailed} transfer${kathyCur.realFailed === 1 ? "" : "s"} of real callers failed technically`,
        `Kathy tried to hand them off and the transfer didn't complete. That's a telephony problem, not a screening problem.`,
        "Check the Retell transfer destination and SIP setup.");
      if (kathyCur.spamPassed > 2) push("yellow",
        `Kathy offered to transfer ${kathyCur.spamPassed} spam callers`,
        `Sellers and robocalls are getting the dispatch handoff line.`,
        "The Spam Kathy tab shows which pitches fooled her; feed those into the prompt.");
    }

    const order = { red: 0, yellow: 1, green: 2 };
    return out.sort((a, b) => order[a.sev] - order[b.sev]).slice(0, 7);
  }, [cur, prev, openEstimates, kathyCur]);

  /* ---------- compare tab ---------- */
  const [comparePreset, setComparePreset] = useState("m");
  const [cmpA1, setCmpA1] = useState(""); const [cmpA2, setCmpA2] = useState("");
  const [cmpB1, setCmpB1] = useState(""); const [cmpB2, setCmpB2] = useState("");
  const compareRanges = useMemo(() => {
    const now = ctNow(); now.setHours(23, 59, 59, 999);
    const som = (d) => { const x = new Date(d.getFullYear(), d.getMonth(), 1); return x; };
    if (comparePreset === "m") {
      const aS = som(now);
      const bS = new Date(now.getFullYear(), now.getMonth() - 1, 1);
      const bE = new Date(now.getFullYear(), now.getMonth(), 0); bE.setHours(23, 59, 59, 999);
      return { a: [aS, now], b: [bS, bE], la: "This month", lb: "Last month" };
    }
    if (comparePreset === "q") {
      const qm = Math.floor(now.getMonth() / 3) * 3;
      const aS = new Date(now.getFullYear(), qm, 1);
      const bS = new Date(now.getFullYear(), qm - 3, 1);
      const bE = new Date(now.getFullYear(), qm, 0); bE.setHours(23, 59, 59, 999);
      return { a: [aS, now], b: [bS, bE], la: "This quarter", lb: "Last quarter" };
    }
    if (comparePreset === "30") {
      const aS = new Date(now); aS.setDate(aS.getDate() - 29); aS.setHours(0, 0, 0, 0);
      const bE = new Date(aS.getTime() - 1);
      const bS = new Date(bE); bS.setDate(bS.getDate() - 29); bS.setHours(0, 0, 0, 0);
      return { a: [aS, now], b: [bS, bE], la: "Last 30 days", lb: "Prior 30 days" };
    }
    const mk = (s, e) => (s && e ? [new Date(s + "T00:00:00"), new Date(e + "T23:59:59")] : null);
    return { a: mk(cmpA1, cmpA2), b: mk(cmpB1, cmpB2), la: "Period A", lb: "Period B" };
  }, [comparePreset, cmpA1, cmpA2, cmpB1, cmpB2]);
  const cmpA = useMemo(() => (compareRanges.a ? computeStats(dataIdx, compareRanges.a, data.numFilter, data.manual) : null), [dataIdx, compareRanges, data.numFilter, data.manual]);
  const cmpB = useMemo(() => (compareRanges.b ? computeStats(dataIdx, compareRanges.b, data.numFilter, data.manual) : null), [dataIdx, compareRanges, data.numFilter, data.manual]);

  /* drill-down state for the Overview lists */
  const [openEstRow, setOpenEstRow] = useState(null);
  const [estAgeFilter, setEstAgeFilter] = useState("all");
  const [estView, setEstView] = useState("open");
  const [clp, setClp] = useState({});
  const [catMore, setCatMore] = useState({});
  const [hcpStatus, setHcpStatus] = useState(null);
  const [hcpBusy, setHcpBusy] = useState(false);
  const startHcpSync = async () => {
    setHcpBusy(true);
    try {
      const r = await fetch("/api/hcp/sync", { method: "POST" }).then((x) => x.json());
      if (r.error) { setHcpStatus({ error: r.error }); setHcpBusy(false); return; }
      const poll = async () => {
        const st = await fetch("/api/hcp/sync/status").then((x) => x.json()).catch(() => null);
        if (st) setHcpStatus(st);
        if (st && !st.running && st.finishedAt) {
          setHcpBusy(false);
          const d = await fetch("/api/data").then((x) => x.json()).catch(() => null);
          if (d) setData((prev) => ({ ...prev, ...d, _phoneIdx: buildPhoneIndex(d.jobs || []) }));
          return;
        }
        setTimeout(poll, 1500);
      };
      poll();
    } catch (e) { setHcpStatus({ error: e.message }); setHcpBusy(false); }
  };
  const tglClp = (k) => setClp((c) => ({ ...c, [k]: !c[k] }));
  const [showAllEst, setShowAllEst] = useState(false);
  const [openCallRow, setOpenCallRow] = useState(null);
  const [showAllCalls, setShowAllCalls] = useState(false);

  const health = useMemo(() => {
    const graded = scored.filter((s) => ["green", "yellow", "red"].includes(s.status));
    if (!graded.length) return { pct: 0, g: 0, y: 0, r: 0, total: 0 };
    const g = graded.filter((s) => s.status === "green").length;
    const y = graded.filter((s) => s.status === "yellow").length;
    const r = graded.filter((s) => s.status === "red").length;
    return { pct: Math.round(((g + y * 0.5) / graded.length) * 100), g, y, r, total: graded.length };
  }, [scored]);

  /* ---------- upload flow ---------- */
  const readWorkbook = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => { try { resolve(XLSX.read(e.target.result, { type: "array", cellDates: true })); } catch (err) { reject(err); } };
    reader.onerror = () => reject(new Error("read failed"));
    reader.readAsArrayBuffer(file);
  });

  const mapKey = (type, headers) => type + "|" + headers.join("\u00a6");

  /* mutates `working` and returns counts */
  const applyImport = (working, type, rows, map) => {
    let normalized = rows.map((r) => normalizeRow(type, r, map)).filter(Boolean);
    if (type === "ads" && normalized.some((r) => r.kind === "ta")) normalized = normalized.filter((r) => r.kind === "ta");

    if (type === "kathy") {
      const kept = [...(working.kathy || [])];
      const byId = {};
      kept.forEach((r, i) => { if (r.cid) byId[r.cid] = i; });
      const seenNoId = new Set(kept.filter((r) => !r.cid).map((r) => JSON.stringify(r)));
      let addedCount = 0, dupes = 0;
      let updated = 0;
      normalized.forEach((r) => {
        if (r.cid) {
          if (byId[r.cid] !== undefined) {
            const i = byId[r.cid];
            if (JSON.stringify(kept[i]) !== JSON.stringify(r)) { kept[i] = r; updated++; } else dupes++;
          } else { byId[r.cid] = kept.length; kept.push(r); addedCount++; }
        } else {
          const k = JSON.stringify(r);
          if (seenNoId.has(k)) dupes++; else { seenNoId.add(k); kept.push(r); addedCount++; }
        }
      });
      working.kathy = kept.sort((a, b) => (a.d < b.d ? -1 : 1));
      return { added: addedCount, dupes, updated };
    }

    if (type === "estimates") {
      const kept = [...(working.estimates || [])];
      const byId = {};
      kept.forEach((r, i) => { if (r.eid) byId[r.eid] = i; });
      const seenNoId = new Set(kept.filter((r) => !r.eid).map((r) => JSON.stringify(r)));
      let addedCount = 0, dupes = 0, updated = 0;
      normalized.forEach((r) => {
        if (r.eid) {
          if (byId[r.eid] !== undefined) {
            const i = byId[r.eid];
            if (JSON.stringify(kept[i]) !== JSON.stringify(r)) { kept[i] = r; updated++; } else dupes++;
          } else { byId[r.eid] = kept.length; kept.push(r); addedCount++; }
        } else {
          const k = JSON.stringify(r);
          if (seenNoId.has(k)) { dupes++; } else { seenNoId.add(k); kept.push(r); addedCount++; }
        }
      });
      working.estimates = kept.sort((a, b) => (a.d < b.d ? -1 : 1));
      return { added: addedCount, dupes, updated };
    }

    if (type === "jobs") {
      if (normalized.length >= (working.jobs || []).length) {
        const prevN = (working.jobs || []).length;
        working.jobs = [...normalized].sort((a, b) => (a.d < b.d ? -1 : 1));
        return { added: normalized.length, dupes: 0, updated: 0, rebuilt: prevN };
      }
      /* merge by Job #: a re-uploaded job (e.g. scheduled → completed) replaces
         its old row instead of duplicating it */
      const kept = [...working.jobs];
      const byId = {};
      kept.forEach((r, i) => { if (r.jid) byId[r.jid] = i; });
      const seenNoId = new Set(kept.filter((r) => !r.jid).map((r) => JSON.stringify(r)));
      let addedCount = 0, dupes = 0, updated = 0;
      normalized.forEach((r) => {
        if (r.jid) {
          if (byId[r.jid] !== undefined) {
            const i = byId[r.jid];
            if (JSON.stringify(kept[i]) !== JSON.stringify(r)) { kept[i] = r; updated++; } else dupes++;
          } else { byId[r.jid] = kept.length; kept.push(r); addedCount++; }
        } else {
          const k = JSON.stringify(r);
          if (seenNoId.has(k)) { dupes++; } else { seenNoId.add(k); kept.push(r); addedCount++; }
        }
      });
      working.jobs = kept.sort((a, b) => (a.d < b.d ? -1 : 1));
      return { added: addedCount, dupes, updated };
    }

    const existing = working[type];
    const seen = new Set(existing.map((r) => JSON.stringify(r)));
    const added = normalized.filter((r) => { const k = JSON.stringify(r); if (seen.has(k)) return false; seen.add(k); return true; });
    if (type === "calls") {
      working.numFilter = { ...working.numFilter }; working.numMeta = { ...working.numMeta };
      added.forEach((r) => {
        if (!r.tn) return;
        if (!(r.tn in working.numFilter)) working.numFilter[r.tn] = defaultInclude(r.nn, r.co);
        if (!working.numMeta[r.tn]) working.numMeta[r.tn] = { nn: r.nn, co: r.co };
      });
    }
    const stored = type === "calls" ? added.map(({ nn, co, ...rest }) => rest) : added;
    working[type] = [...existing, ...stored].sort((a, b) => (a.d < b.d ? -1 : 1));
    return { added: added.length, dupes: normalized.length - added.length };
  };

  /* multi-file upload: recognized files import instantly; the mapping
     screen only appears when a required column can't be found, and
     confirmed mappings are remembered for future uploads */
  const handleFiles = async (type, fileList) => {
    setUploadMsg(null);
    const files = Array.from(fileList);
    const working = { ...data, mapMemory: { ...(data.mapMemory || {}) } };
    let added = 0, dupes = 0, imported = 0, unreadable = 0, updatedCount = 0;
    const needsMapping = [];
    for (const file of files) {
      let table = null;
      try {
        const wb = await readWorkbook(file);
        table = findTable(wb, SOURCES[type].fields);
      } catch (e) { /* handled below */ }
      if (!table || !table.rows.length) { unreadable++; continue; }
      let map = working.mapMemory[mapKey(type, table.headers)];
      if (!map) {
        map = {}; const used = new Set();
        SOURCES[type].fields.forEach((f) => { const hit = matchHeader(table.headers, used, f.match); if (hit) { map[f.id] = hit; used.add(hit); } });
      } else {
        map = { ...map };
        const used = new Set(Object.values(map));
        SOURCES[type].fields.forEach((f) => {
          if (!map[f.id]) { const hit = matchHeader(table.headers, used, f.match); if (hit) { map[f.id] = hit; used.add(hit); } }
        });
      }
      let missing = SOURCES[type].fields.filter((f) => f.required && !map[f.id]);
      /* estimates need a dollar column and a decision column to be useful */
      if (type === "estimates" && (!map.amount || (!map.outcome && !map.status))) {
        missing = missing.concat(SOURCES.estimates.fields.filter((f) => (f.id === "amount" || f.id === "outcome") && !map[f.id]));
      }
      if (missing.length) { needsMapping.push({ type, headers: table.headers, rows: table.rows, map, fileName: file.name }); continue; }
      const res = applyImport(working, type, table.rows, map);
      working.mapMemory[mapKey(type, table.headers)] = map;
      added += res.added; dupes += res.dupes; updatedCount += res.updated || 0; imported++;
    }
    if (imported) persist(working);
    const parts = [];
    if (imported) parts.push(`${imported} file${imported === 1 ? "" : "s"} imported: ${added.toLocaleString()} new rows${updatedCount ? `, ${updatedCount.toLocaleString()} jobs updated` : ""}, ${dupes.toLocaleString()} duplicates skipped.`);
    if (unreadable) parts.push(`${unreadable} file(s) couldn't be read (export as CSV or XLSX).`);
    if (needsMapping.length) parts.push(`${needsMapping.length} file(s) need a one-time column mapping below.`);
    if (parts.length) setUploadMsg({ ok: unreadable === 0, text: parts.join(" ") });
    if (needsMapping.length) setPendingList(needsMapping);
  };

  const pending = pendingList[0] || null;

  const confirmImport = () => {
    const p = pending;
    const missing = SOURCES[p.type].fields.filter((f) => f.required && !p.map[f.id]);
    if (missing.length) { setUploadMsg({ ok: false, text: "Pick a column for: " + missing.map((f) => f.label).join(", ") }); return; }
    const working = { ...data, mapMemory: { ...(data.mapMemory || {}) } };
    const res = applyImport(working, p.type, p.rows, p.map);
    working.mapMemory[mapKey(p.type, p.headers)] = p.map; // remembered: this file layout never asks again
    persist(working);
    setUploadMsg({ ok: true, text: `${p.fileName}: ${res.added.toLocaleString()} new rows imported, ${res.dupes.toLocaleString()} duplicates skipped.` });
    setPendingList(pendingList.slice(1));
  };

  const clearSource = (type) => persist({ ...data, [type]: [] });

  /* ---------- backup / restore (needed on hosts that block saving) ---------- */
  const downloadBackup = () => {
    const { _phoneIdx, ...toSave } = data;
    const blob = new Blob([JSON.stringify(toSave)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `mplr-kpi-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  };
  const restoreBackup = (file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        const next = { calls: [], jobs: [], ads: [], lsa: [], lsabill: [], estimates: [], kathy: [], followups: {}, settings: {}, manual: {}, numFilter: {}, numMeta: {}, mapMemory: {}, ...parsed };
        persist(next);
        setUploadMsg({ ok: true, text: "Backup restored." });
      } catch (err) { setUploadMsg({ ok: false, text: "That doesn't look like a dashboard backup file." }); }
    };
    reader.readAsText(file);
  };

  /* ---------- trends ----------
     Cost metrics chart MONTHLY: ad and LSA spend arrive as monthly-grade
     data (lumpy billing transactions), so weekly cost-per-lead points are
     noise. Monthly points use the exact same math as the scorecard filtered
     to that month, so the two views always agree. Volume/rate metrics
     stay weekly. */
  const trendMonthly = (METRICS.find((x) => x.id === trendMetric) || {}).trendGranularity === "month";
  const trendData = useMemo(() => {
    if (!allDates.length) return [];
    const first = new Date(allDates[0] + "T00:00:00");
    const last = new Date(allDates[allDates.length - 1] + "T00:00:00");
    const out = [];
    if (trendMonthly) {
      const cur = new Date(first.getFullYear(), first.getMonth(), 1);
      while (cur <= last && out.length < 60) {
        const a = new Date(cur);
        const b = new Date(cur.getFullYear(), cur.getMonth() + 1, 0); b.setHours(23, 59, 59, 999);
        const stats = computeStats(dataIdx, [a, b], data.numFilter, data.manual);
        const v = stats.values[trendMetric];
        if (v != null) out.push({ week: `${a.getFullYear()}-${String(a.getMonth() + 1).padStart(2, "0")}`, value: Number(v.toFixed(2)) });
        cur.setMonth(cur.getMonth() + 1);
      }
      return out;
    }
    const start = new Date(first);
    start.setDate(start.getDate() - ((start.getDay() + 1) % 7));
    for (let a = new Date(start); a <= last; a.setDate(a.getDate() + 7)) {
      const b = new Date(a); b.setDate(b.getDate() + 6); b.setHours(23, 59, 59, 999);
      const stats = computeStats(dataIdx, [new Date(a), b], data.numFilter, data.manual);
      const v = stats.values[trendMetric];
      if (v != null) out.push({ week: dkey(b).slice(5), value: Number(v.toFixed(2)) });
    }
    return out;
  }, [dataIdx, trendMetric, allDates, data.numFilter, data.manual, trendMonthly]);

  if (!loaded) {
    return <div style={{ minHeight: "100vh", background: C.navy, display: "flex", alignItems: "center", justifyContent: "center", color: C.dim, fontFamily: "Arial" }}>Loading dashboard…</div>;
  }

  const trendM = METRICS.find((x) => x.id === trendMetric);
  const rangeLabel = `${dkey(range[0])} → ${dkey(range[1])}`;
  const hasData = allDates.length > 0;

  return (
    <div className="root">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap');
        * { box-sizing: border-box; margin: 0; }
        .root { min-height:100vh; background:${C.navy}; color:${C.ink}; font-family:'Barlow Semi Condensed', Arial, sans-serif; font-size:15px;
          background-image: radial-gradient(ellipse 80% 50% at 50% -10%, ${C.glow} 0%, transparent 60%); }
        .wrap { max-width:1100px; margin:0 auto; padding:28px 20px 60px; }
        .masthead { display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px; border-bottom:2px solid ${C.gold}; padding-bottom:14px; }
        .brand { font-family:'Barlow Condensed', Arial, sans-serif; font-weight:700; font-size:30px; letter-spacing:.04em; text-transform:uppercase; }
        .brand span { color:${C.gold}; }
        .sub { color:${C.dim}; font-size:13px; letter-spacing:.12em; text-transform:uppercase; }
        .toolbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:16px 0 6px; }
        .chipbtn { background:transparent; color:${C.dim}; border:1px solid ${C.line}; border-radius:20px; padding:6px 14px; cursor:pointer; font:inherit; font-weight:600; font-size:13px; }
        .chipbtn:hover { color:${C.ink}; border-color:${C.gold}; }
        .chipbtn.on { background:${C.gold}; color:${C.onGold}; border-color:${C.gold}; }
        .themetoggle { display:flex; border:1px solid ${C.line}; border-radius:20px; overflow:hidden; }
        .themetoggle button { background:transparent; color:${C.dim}; border:none; padding:6px 14px; font:inherit; font-weight:600; font-size:12.5px; cursor:pointer; }
        .themetoggle button.on { background:${C.gold}; color:${C.onGold}; }
        .rangelabel { margin-left:auto; color:${C.dim}; font-size:13px; }
        .tabs { display:flex; gap:6px; margin:14px 0 20px; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:2px; }
        .tabs::-webkit-scrollbar { display:none; }
        .tabs .tab { flex:none; }
        .tab { background:transparent; color:${C.dim}; border:1px solid ${C.line}; border-radius:4px; padding:8px 16px; cursor:pointer; font:inherit; font-weight:600; letter-spacing:.05em; text-transform:uppercase; font-size:12.5px; }
        .tab:hover { color:${C.ink}; border-color:${C.gold}; }
        .tab.on { background:${C.gold}; color:${C.onGold}; border-color:${C.gold}; }
        .tab:focus-visible, .btn:focus-visible, .chipbtn:focus-visible, input:focus-visible, select:focus-visible, .numrow:focus-visible { outline:2px solid ${C.goldSoft}; outline-offset:2px; }
        select, input[type=number], input[type=date] { background:${C.navy3}; border:1px solid ${C.line}; color:${C.ink}; border-radius:4px; padding:7px 10px; font:inherit; }
        select option { background:${C.navy2}; }
        .gauge { display:flex; align-items:center; gap:18px; background:${C.navy2}; border:1px solid ${C.line}; border-radius:8px; padding:16px 18px; margin-bottom:20px; flex-wrap:wrap; }
        .pool { position:relative; width:74px; height:74px; border-radius:50%; border:2px solid ${C.gold}; overflow:hidden; background:${C.navy3}; flex:none; }
        .water { position:absolute; left:0; right:0; bottom:0; background:linear-gradient(180deg,#2e6f8f,#1d4a63); transition:height .6s ease; }
        .water::before { content:""; position:absolute; top:-3px; left:-10%; width:120%; height:6px; background:${C.goldSoft}; opacity:.55; border-radius:50%; }
        .pct { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Barlow Condensed'; font-size:22px; font-weight:700; text-shadow:0 1px 3px rgba(0,0,0,.6); }
        .gaugeInfo b { font-family:'Barlow Condensed'; font-size:19px; letter-spacing:.03em; text-transform:uppercase; }
        .pills { display:flex; gap:8px; margin-top:6px; flex-wrap:wrap; }
        .pill { font-size:12.5px; padding:2px 10px; border-radius:20px; font-weight:600; }

                    })()}

                  </div>

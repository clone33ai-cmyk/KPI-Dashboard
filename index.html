<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hello World</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e1e2f, #3a3a5c);
    font-family: system-ui, sans-serif;
  }

  h1 {
    color: #fff;
    font-size: 3rem;
    cursor: pointer;
    transition: transform 0.2s ease, color 0.2s ease;
    user-select: none;
  }

  h1:hover {
    transform: scale(1.1);
    color: #7ee8fa;
  }
</style>
</head>
<body>
  <h1 id="greeting">Hello, World!</h1>

  <script>
    const greetings = [
      "Hello, World!",
      "Hola, Mundo!",
      "Bonjour, le Monde!",
      "こんにちは世界!",
      "Hallo, Welt!",
      "Ciao, Mondo!"
    ];

    const el = document.getElementById("greeting");
    let i = 0;

    el.addEventListener("click", () => {
      i = (i + 1) % greetings.length;
      el.textContent = greetings[i];
    });
  </script>
</body>
</html>
